name: Lightweight CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-evidence:
    name: Python tests and evidence integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install test runner
        run: python -m pip install 'pytest==8.4.2' 'ruff==0.14.1' -r requirements-arecel.txt
      - name: Install pinned Advisor add-only greedy backend
        run: >-
          python -m pip install
          'scipy==1.18.1' 'networkx==3.7'
          'pess-ess @ git+https://github.com/1951123/ess-advisor.git@5d61f75fede37d34027b437c646000a3d78d00c6'
      - name: Run offline regression tests
        run: |
          python -m pytest -q \
            experiments/add-only-greedy-issue87/test_stage0_preflight.py \
            experiments/add-only-greedy-issue87/test_issue95_attribution.py \
            ci/test_check_evidence.py \
            ci/test_theory_star_reductions.py \
            experiments/pg-maintenance/test_analyze_benchmark.py \
            experiments/pg-maintenance/fixed-target-cpu/test_fixed_target_cpu.py \
            experiments/pg-tracing/test_analyze_mcv_numeric_followup.py \
            experiments/theory/test_degree_two_oracle.py \
            experiments/add-only-greedy-issue87/test_runner.py \
            tests/test_forest10_etl.py \
            tests/test_arecel_real_etl.py \
            tests/test_verified_pickle_converter.py \
            tests/test_arecel_prepare.py \
            experiments/solver-integration-issue74/test_stage2_b23_protocol.py \
            experiments/solver-integration-issue74/test_stage2_b23_runner.py \
            experiments/solver-integration-issue74/test_stage2_b2_recovery_runner.py
      - name: Verify Issue 123 shared-priority theory oracle
        run: python3 -m unittest discover -s tests -p 'test_shared_priority_theory_issue123.py' -v
      - name: Lint archive-first infrastructure
        run: |
          ruff check src/ess_research/task_paths.py src/ess_research/arecel/archive.py src/ess_research/arecel/__main__.py src/ess_research/arecel/__init__.py tests/test_arecel_prepare.py tests/arecel_consumer.py experiments/add-only-greedy-issue87/adapter.py experiments/add-only-greedy-issue87/test_stage0_preflight.py experiments/add-only-greedy-issue87/run_issue87.py experiments/add-only-greedy-issue87/test_runner.py experiments/add-only-greedy-issue87/analyze_issue95.py experiments/add-only-greedy-issue87/test_issue95_attribution.py
          ruff format --check src/ess_research/task_paths.py src/ess_research/arecel/archive.py src/ess_research/arecel/__main__.py src/ess_research/arecel/__init__.py tests/test_arecel_prepare.py tests/arecel_consumer.py experiments/add-only-greedy-issue87/adapter.py experiments/add-only-greedy-issue87/test_stage0_preflight.py experiments/add-only-greedy-issue87/run_issue87.py experiments/add-only-greedy-issue87/test_runner.py experiments/add-only-greedy-issue87/analyze_issue95.py experiments/add-only-greedy-issue87/test_issue95_attribution.py
      - name: Verify preserved experimental evidence
        run: python ci/check_evidence.py

  paper:
    name: Build paper PDF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Compile bundled PVLDB LaTeX template
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper
          texlive_version: '2026'
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Save compiled PDF
        uses: actions/upload-artifact@v6
        with:
          name: paper-preview
          path: paper/main.pdf
          if-no-files-found: error
          retention-days: 7
